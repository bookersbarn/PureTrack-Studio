          $zip = Join-Path $env:RUNNER_TEMP 'PureTrackStudioSource.zip'
          $source = Join-Path $env:RUNNER_TEMP 'PureTrackStudioSource'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String(($payload -replace '\s','')))
          Expand-Archive $zip $source -Force
          Get-ChildItem $source -Force | Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          git config user.name 'PureTrack Studio Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Add PureTrack Studio 0.2.0 Windows build source'
            git push
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Assemble bundled engines
        shell: powershell
        run: .\scripts\prepare-engines.ps1

      - name: Build application and installer
        shell: powershell
        run: .\build-windows.ps1

      - name: Verify installer
        shell: powershell
        run: |
          $installer = '.\artifacts\PureTrack Studio Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not created.' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PureTrack-Studio-Windows-Installer-RC
          path: artifacts/PureTrack Studio Setup.exe
          if-no-files-found: error
          retention-days: 30

